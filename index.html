<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alperen Ultimate Arduino & Bike Open-World OS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            cursor: none !important;
        }
        body {
            background-color: #05050a;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }
        /* Özel Havalı Mouse */
        #custom-cursor {
            position: fixed;
            top: 0;
            left: 0;
            width: 24px;
            height: 24px;
            border: 2px solid #00ffcc;
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            transition: width 0.15s, height 0.15s, background-color 0.15s;
            z-index: 9999;
            box-shadow: 0 0 15px #00ffcc, inset 0 0 5px #00ffcc;
        }
        #custom-cursor-dot {
            position: fixed;
            top: 0;
            left: 0;
            width: 6px;
            height: 6px;
            background-color: #ff007f;
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 10000;
            box-shadow: 0 0 10px #ff007f;
        }
        .trail {
            position: fixed;
            pointer-events: none;
            width: 10px;
            height: 10px;
            background: rgba(0, 255, 204, 0.5);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 9998;
            animation: fadeOut 0.5s forwards;
        }
        @keyframes fadeOut {
            to {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.2);
            }
        }

        /* Arayüz Panelleri */
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
        }
        canvas {
            background: linear-gradient(135deg, #0b0b16 0%, #121224 100%);
            display: block;
            flex-grow: 1;
        }
        .sidebar {
            width: 320px;
            background: rgba(10, 10, 25, 0.9);
            border-left: 2px solid #00ffcc;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: -5px 0 25px rgba(0, 255, 204, 0.2);
            z-index: 10;
        }
        h1 {
            font-size: 20px;
            color: #ff007f;
            text-shadow: 0 0 10px #ff007f;
            border-bottom: 1px dashed #00ffcc;
            padding-bottom: 8px;
        }
        .panel-box {
            background: rgba(0, 255, 204, 0.05);
            border: 1px solid #00ffcc;
            padding: 12px;
            border-radius: 6px;
            box-shadow: inset 0 0 10px rgba(0, 255, 204, 0.1);
        }
        .btn {
            background: transparent;
            border: 1px solid #ff007f;
            color: #ff007f;
            padding: 10px;
            font-family: inherit;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.2s;
            text-shadow: 0 0 5px #ff007f;
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.2);
            width: 100%;
            margin-top: 5px;
        }
        .btn:hover {
            background: #ff007f;
            color: #05050a;
            box-shadow: 0 0 20px #ff007f;
        }
        .stats {
            font-size: 14px;
            line-height: 1.6;
        }
        .highlight {
            color: #ffff00;
            text-shadow: 0 0 5px #ffff00;
        }
    </style>
</head>
<body>

    <div id="custom-cursor"></div>
    <div id="custom-cursor-dot"></div>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div class="sidebar">
            <h1>ALPEREN ULTIMATE OS</h1>
            <div class="panel-box stats">
                <p>Sistem: <span class="highlight">PC / 6-TEL / ARDUINO</span></p>
                <p>Mod: <span class="highlight">BİSİKLET & AÇIK DÜNYA</span></p>
                <p>Skor: <span id="score" class="highlight">0</span></p>
                <p>Beyaz Tabak: <span id="plates" class="highlight">0</span></p>
                <p>Arduino DSL: <span id="arduino-status" class="highlight">BAĞLANDI</span></p>
            </div>
            <div class="panel-box">
                <p style="font-size: 12px; margin-bottom: 8px;">KONTROLLER:</p>
                <p style="font-size: 12px;">W/A/S/D veya YÖN TUŞLARI: Bisiklet Sürme</p>
                <p style="font-size: 12px;">BOŞLUK (SPACE): Turbo Zıplama</p>
            </div>
            <button class="btn" onclick="boostSpeed()">ARDUINO NITRO BOOST</button>
            <button class="btn" onclick="spawnPlate()">BEYAZ TABAK ÜRET</button>
            <button class="btn" onclick="resetGame()">SİSTEMİ YENİDEN BAŞLAT</button>
        </div>
    </div>

    <script>
        // Özel Havalı Mouse Takibi
        const cursor = document.getElementById('custom-cursor');
        const cursorDot = document.getElementById('custom-cursor-dot');

        let mouseX = 0, mouseY = 0;
        let cursorX = 0, cursorY = 0;

        window.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            cursorDot.style.left = mouseX + 'px';
            cursorDot.style.top = mouseY + 'px';

            // Trail efekti
            if(Math.random() < 0.3) {
                const trail = document.createElement('div');
                trail.className = 'trail';
                trail.style.left = mouseX + 'px';
                trail.style.top = mouseY + 'px';
                document.body.appendChild(trail);
                setTimeout(() => trail.remove(), 500);
            }
        });

        function animateCursor() {
            cursorX += (mouseX - cursorX) * 0.2;
            cursorY += (mouseY - cursorY) * 0.2;
            cursor.style.left = cursorX + 'px';
            cursor.style.top = cursorY + 'px';
            requestAnimationFrame(animateCursor);
        }
        animateCursor();

        window.addEventListener('mousedown', () => {
            cursor.style.width = '36px';
            cursor.style.height = '36px';
            cursor.style.backgroundColor = 'rgba(0, 255, 204, 0.2)';
        });
        window.addEventListener('mouseup', () => {
            cursor.style.width = '24px';
            cursor.style.height = '24px';
            cursor.style.backgroundColor = 'transparent';
        });

        // Oyun Mantığı (Canvas)
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth - 320;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let score = 0;
        let platesCount = 0;
        let speedMultiplier = 1;

        // Bisikletçi Karakteri
        let bike = {
            x: 100,
            y: canvas.height / 2,
            radius: 20,
            speed: 5,
            angle: 0
        };

        // Toplanabilir Nesneler (Beyaz Tabak ve Arduino Parçaları)
        let collectibles = [];

        function spawnCollectible() {
            collectibles.push({
                x: canvas.width + 50,
                y: Math.random() * (canvas.height - 100) + 50,
                type: Math.random() > 0.5 ? 'plate' : 'arduino',
                size: 15
            });
        }

        setInterval(spawnCollectible, 1500);

        let keys = {};
        window.addEventListener('keydown', (e) => keys[e.key] = true);
        window.addEventListener('keyup', (e) => keys[e.key] = false);

        function boostSpeed() {
            speedMultiplier = 2.5;
            setTimeout(() => speedMultiplier = 1, 3000);
        }

        function spawnPlate() {
            platesCount++;
            document.getElementById('plates').innerText = platesCount;
        }

        function resetGame() {
            score = 0;
            platesCount = 0;
            collectibles = [];
            bike.y = canvas.height / 2;
            document.getElementById('score').innerText = score;
            document.getElementById('plates').innerText = platesCount;
        }

        // Oyun Döngüsü
        function update() {
            // Hareket
            if ((keys['ArrowUp'] || keys['w'] || keys['W']) && bike.y > 30) bike.y -= bike.speed * speedMultiplier;
            if ((keys['ArrowDown'] || keys['s'] || keys['S']) && bike.y < canvas.height - 30) bike.y += bike.speed * speedMultiplier;
            if ((keys['ArrowLeft'] || keys['a'] || keys['A']) && bike.x > 50) bike.x -= bike.speed;
            if ((keys['ArrowRight'] || keys['d'] || keys['D']) && bike.x < canvas.width / 2) bike.x += bike.speed;

            // Koleksiyon nesneleri güncelleme
            for (let i = collectibles.length - 1; i >= 0; i--) {
                collectibles[i].x -= 4 * speedMultiplier;

                // Çarpışma kontrolü
                let dx = bike.x - collectibles[i].x;
                let dy = bike.y - collectibles[i].y;
                let dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < bike.radius + collectibles[i].size) {
                    if (collectibles[i].type === 'plate') {
                        platesCount++;
                        document.getElementById('plates').innerText = platesCount;
                    } else {
                        score += 100;
                        document.getElementById('score').innerText = score;
                    }
                    collectibles.splice(i, 1);
                } else if (collectibles[i].x < -50) {
                    collectibles.splice(i, 1);
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Arka plan grid çizgileri (Açık dünya hissi)
            ctx.strokeStyle = 'rgba(0, 255, 204, 0.05)';
            ctx.lineWidth = 1;
            for (let i = 0; i < canvas.width; i += 40) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, canvas.height);
                ctx.stroke();
            }
            for (let i = 0; i < canvas.height; i += 40) {
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(canvas.width, i);
                ctx.stroke();
            }

            // Koleksiyon Nesnelerini Çiz
            collectibles.forEach(item => {
                ctx.save();
                ctx.translate(item.x, item.y);
                if (item.type === 'plate') {
                    // Beyaz Tabak
                    ctx.fillStyle = '#ffffff';
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(0, 0, item.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#cccccc';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                } else {
                    // Arduino / Çip
                    ctx.fillStyle = '#ff007f';
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = '#ff007f';
                    ctx.fillRect(-item.size, -item.size / 2, item.size * 2, item.size);
                }
                ctx.restore();
            });

            // Bisiklet / Karakter Çizimi (Alperen'in Bisikleti)
            ctx.save();
            ctx.translate(bike.x, bike.y);
            ctx.fillStyle = '#00ffcc';
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#00ffcc';

            // Bisiklet Gövdesi / Tekerlekler
            ctx.beginPath();
            ctx.arc(-12, 10, 10, 0, Math.PI * 2);
            ctx.arc(12, 10, 10, 0, Math.PI * 2);
            ctx.fillStyle = '#ff007f';
            ctx.fill();

            ctx.strokeStyle = '#00ffcc';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(-12, 10);
            ctx.lineTo(0, -5);
            ctx.lineTo(12, 10);
            ctx.moveTo(0, -5);
            ctx.lineTo(0, -15);
            ctx.stroke();

            ctx.restore();
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }
        loop();
    </script>
</body>
</html>
