<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alperen Evreni - 1000+ Özellik ve Görev</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --accent-hover: #0ea5e9;
            --border-color: #334155;
        }

        [data-theme="light"] {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-color: #0f172a;
            --accent-color: #0284c7;
            --accent-hover: #0369a1;
            --border-color: #cbd5e1;
        }

        [data-theme="matrix"] {
            --bg-color: #020617;
            --card-bg: #052e16;
            --text-color: #4ade80;
            --accent-color: #22c55e;
            --accent-hover: #16a34a;
            --border-color: #14532d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background 0.3s, color 0.3s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-size: 1.8rem;
            color: var(--accent-color);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .controls {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        select, button {
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-weight: 600;
        }

        button:hover {
            background-color: var(--accent-color);
            color: #ffffff;
            border-color: var(--accent-color);
        }

        main {
            flex: 1;
            max-width: 1400px;
            margin: 2rem auto;
            padding: 0 1rem;
            width: 100%;
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 2rem;
        }

        @media (max-width: 900px) {
            main {
                grid-template-columns: 1fr;
            }
        }

        .sidebar {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 1rem;
            padding: 1.5rem;
            height: fit-content;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .stat-box {
            background: var(--bg-color);
            padding: 1rem;
            border-radius: 0.5rem;
            border: 1px solid var(--border-color);
            text-align: center;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            color: var(--accent-color);
        }

        .content-area {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 1rem;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .search-box {
            width: 100%;
            padding: 0.75rem 1rem;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 0.5rem;
            font-size: 1rem;
            outline: none;
        }

        .search-box:focus {
            border-color: var(--accent-color);
        }

        .list-container {
            max-height: 550px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            padding-right: 0.5rem;
        }

        .list-container::-webkit-scrollbar {
            width: 8px;
        }

        .list-container::-webkit-scrollbar-track {
            background: var(--bg-color);
            border-radius: 4px;
        }

        .list-container::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }

        .item-card {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 1rem;
            border-radius: 0.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }

        .item-info {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .item-id {
            font-size: 0.8rem;
            color: var(--accent-color);
            font-weight: bold;
        }

        .item-title {
            font-size: 1rem;
            font-weight: 600;
        }

        .action-btn {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 0.4rem 0.8rem;
            border-radius: 0.3rem;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .action-btn:hover {
            background: var(--accent-hover);
        }

        footer {
            text-align: center;
            padding: 1.5rem;
            background-color: var(--card-bg);
            border-top: 1px solid var(--border-color);
            margin-top: auto;
            font-size: 0.9rem;
            color: var(--border-color);
        }

        .tabs {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .tab-btn {
            flex: 1;
            padding: 0.5rem;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 0.4rem;
            cursor: pointer;
            text-align: center;
            font-weight: 600;
        }

        .tab-btn.active {
            background: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }
    </style>
</head>
<body data-theme="dark">

    <header>
        <h1>⚡ Alperen OS & Portal (1000+ Modül)</h1>
        <div class="controls">
            <select id="themeSelector" onchange="changeTheme(this.value)">
                <option value="dark">Koyu Tema</option>
                <option value="light">Açık Tema</option>
                <option value="matrix">Matrix Modu</option>
            </select>
            <button onclick="triggerRandomAction()">Rastgele İşlem</button>
        </div>
    </header>

    <main>
        <div class="sidebar">
            <div class="stat-box">
                <div>Toplam İçerik / Görev</div>
                <div class="stat-number" id="totalCount">1250</div>
            </div>
            
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('all', this)">Tümü</button>
                <button class="tab-btn" onclick="switchTab('missions', this)">Görevler</button>
                <button class="tab-btn" onclick="switchTab('facts', this)">Alperen Bilgileri</button>
                <button class="tab-btn" onclick="switchTab('codes', this));">Kod Parçacıkları</button>
            </div>

            <div class="stat-box">
                <div>Tamamlanan Görevler</div>
                <div class="stat-number" id="completedCount">0</div>
            </div>

            <button onclick="resetProgress()" style="width: 100%; background: #ef4444; border-color: #ef4444; color: white;">Sıfırla</button>
        </div>

        <div class="content-area">
            <input type="text" id="searchInput" class="search-box" placeholder="1250+ Alperen içeriği içinde ara..." oninput="filterItems()">
            <div class="list-container" id="listContainer">
                <!-- Dinamik olarak 1250+ öğe yüklenecek -->
            </div>
        </div>
    </main>

    <footer>
        <p>Alperen Evreni Projesi &copy; 2026 - Tüm Hakları Saklıdır (1000+ Modül Aktif)</p>
    </footer>

    <script>
        // 1250+ Öğeden Oluşan Veritabanı Otomatik Oluşturucu
        const categories = ['missions', 'facts', 'codes'];
        const prefixes = [
            "Alperen'in", "Efsanevi Alperen", "Süper Alperen", "Ultra Alperen", 
            "Mega Alperen", "Cyber Alperen", "Quantum Alperen", "Master Alperen"
        ];
        const actions = [
            "Kod Yazma Görevi #", "Algoritma Çözümü #", "Sistem Optimizasyonu #", 
            "Veritabanı Analizi #", "Donanım Testi #", "Yapay Zeka Eğitimi #", 
            "Güvenlik Duvarı Kırma #", "Pixel Art Tasarımı #"
        ];

        let database = [];
        let currentTab = 'all';
        let completedItems = new Set();

        function generateDatabase() {
            let id = 1;
            // 1250 adet öğe üretelim
            for (let i = 0; i < 500; i++) {
                database.push({
                    id: id++,
                    category: 'missions',
                    title: `Görev ${i + 1}: ${actions[i % actions.length]} ${i + 1}`,
                    desc: `Alperen için özel olarak hazırlanan zorluk seviyesi ${ (i % 5) + 1 } olan pratik görevi tamamla.`
                });
            }
            for (let i = 0; i < 400; i++) {
                database.push({
                    id: id++,
                    category: 'facts',
                    title: `Alperen Gerçeği #${i + 1}`,
                    desc: `Alperen'in teknoloji, yazılım ve evren hakkındaki ${i + 1}. büyük keşfi ve bilgisi.`
                });
            }
            for (let i = 0; i < 350; i++) {
                database.push({
                    id: id++,
                    category: 'codes',
                    title: `Kod Parçacığı #${i + 1} (Snippet)`,
                    desc: `Alperen sistemleri için optimize edilmiş ${i + 1} numaralı hazır fonksiyon ve script.`
                });
            }
            document.getElementById('totalCount').innerText = database.length;
        }

        function renderList(itemsToRender) {
            const container = document.getElementById('listContainer');
            container.innerHTML = '';

            if (itemsToRender.length === 0) {
                container.innerHTML = '<div style="text-align: center; padding: 2rem; color: var(--border-color);">Hiçbir içerik bulunamadı.</div>';
                return;
            }

            // Performans için ilk 100 öğeyi gösterelim, arama yapıldıkça filtrelenir
            const limit = itemsToRender.length > 100 ? 100 : itemsToRender.length;
            
            for (let i = 0; i < limit; i++) {
                const item = itemsToRender[i];
                const isCompleted = completedItems.has(item.id);

                const card = document.createElement('div');
                card.className = 'item-card';
                card.style.opacity = isCompleted ? '0.6' : '1';

                card.innerHTML = `
                    <div class="item-info">
                        <span class="item-id">#${item.id} [${item.category.toUpperCase()}]</span>
                        <div class="item-title" style="${isCompleted ? 'text-decoration: line-through;' : ''}">${item.title}</div>
                        <div style="font-size: 0.85rem; color: var(--border-color);">${item.desc}</div>
                    </div>
                    <button class="action-btn" onclick="toggleComplete(${item.id})">
                        ${isCompleted ? 'İptal Et' : 'Tamamla'}
                    </button>
                `;
                container.appendChild(card);
            }

            if (itemsToRender.length > 100) {
                const info = document.createElement('div');
                info.style.textAlign = 'center';
                info.style.padding = '1rem';
                info.style.color = 'var(--accent-color)';
                info.innerText = `Performans için ilk 100 / ${itemsToRender.length} öğe gösteriliyor. Aramayı daraltın.`;
                container.appendChild(info);
            }
        }

        function filterItems() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            let filtered = database.filter(item => {
                const matchesTab = currentTab === 'all' || item.category === currentTab;
                const matchesQuery = item.title.toLowerCase().includes(query) || item.desc.toLowerCase().includes(query) || item.id.toString().includes(query);
                return matchesTab && matchesQuery;
            });
            renderList(filtered);
        }

        function switchTab(tab, btn) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            filterItems();
        }

        function toggleComplete(id) {
            if (completedItems.has(id)) {
                completedItems.delete(id);
            } else {
                completedItems.add(id);
            }
            document.getElementById('completedCount').innerText = completedItems.size;
            filterItems();
        }

        function changeTheme(theme) {
            document.body.setAttribute('data-theme', theme);
        }

        function triggerRandomAction() {
            const randomId = Math.floor(Math.random() * database.length) + 1;
            const item = database.find(d => d.id === randomId);
            if (item) {
                document.getElementById('searchInput').value = item.title;
                filterItems();
            }
        }

        function resetProgress() {
            completedItems.clear();
            document.getElementById('completedCount').innerText = 0;
            filterItems();
        }

        // Başlangıç
        window.onload = function() {
            generateDatabase();
            filterItems();
        };
    </script>
</body>
</html>
